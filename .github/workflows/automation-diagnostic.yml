name: Automation macOS diagnostic

on:
  push:
    branches: [diagnose/automation-macos-44]

permissions:
  contents: read

jobs:
  reproduce:
    name: Diagnostic (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    env:
      FEISHU_AUTOMATION_DIAGNOSTIC: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Focused reproduction (maximum three rounds, stop on failure)
        run: |
          for round in 1 2 3; do
            echo "Diagnostic round $round"
            node --test --test-name-pattern='the old plan keeps firing|a failed recurring occurrence' dist/test/automation-trigger-cron.test.js dist/test/automation-trigger-lifecycle.test.js || exit $?
          done
      - name: Shared offline suite (only after focused reproduction passes)
        run: node --test dist/test/automation-*.test.js
      - run: git diff --check
